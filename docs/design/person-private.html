<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>@jordan, not visible · Hallway design</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="components.css" />
    <script src="theme.js"></script>
  </head>
  <body class="app">
    <!-- /@jordan when canView(me, jordan) is false: Jordan shares with
         connections only and we are not connected. The public card still
         shows (GetAttendee), the schedule does not, and nothing on the page
         hints at what is on it (no count, no days). Sample data, made up. -->
    <header class="nav">
      <div class="col gutter nav-row">
        <div class="nav-side">
          <a class="navbtn" href="network.html"><svg class="back" aria-hidden="true"><use href="icons.svg#i-back" /></svg>Network</a>
        </div>
        <div class="nav-title">Jordan Ellis</div>
        <div class="nav-side right"></div>
      </div>
    </header>

    <main class="col gutter">
      <div class="group">
        <div class="person">
          <span class="av lg" data-c="5">JE</span>
          <div class="cellmain">
            <h1>Jordan Ellis</h1>
            <span class="cellsub">Solutions Architect, Tailspin Toys</span>
            <span class="cellsub">@jordan · <a href="#">LinkedIn profile</a></span>
          </div>
        </div>
        <div class="person-actions">
          <button class="btn"><svg aria-hidden="true"><use href="icons.svg#i-plus" /></svg>Connect</button>
        </div>
      </div>

      <section class="section">
        <div class="group">
          <div class="empty">
            <svg aria-hidden="true"><use href="icons.svg#i-lock" /></svg>
            <b>Jordan's week is for connections</b>
            <p>Connect with Jordan and you will see their sessions once they accept.</p>
          </div>
        </div>
      </section>
    </main>

    <nav class="tabbar" aria-label="Hallway">
      <span class="brand">Hallway</span>
      <a href="my-week.html"><svg aria-hidden="true"><use href="icons.svg#i-week" /></svg><span>My week</span></a>
      <a href="network.html" aria-current="page"><svg aria-hidden="true"><use href="icons.svg#i-people" /></svg><span>Network</span><span class="badge-n" aria-label="2 requests">2</span></a>
      <a href="connect-agent.html"><svg aria-hidden="true"><use href="icons.svg#i-agent" /></svg><span>Agent</span></a>
      <a href="settings.html"><svg aria-hidden="true"><use href="icons.svg#i-gear" /></svg><span>Settings</span></a>
    </nav>
