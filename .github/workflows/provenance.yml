name: provenance
on:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-main-provenance.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BEFORE: ${{ github.event.before }}
          PROVENANCE_AFTER: ${{ github.event.after }}
